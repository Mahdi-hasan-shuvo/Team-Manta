<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Astra Vigil 2.0 | Team MANTA</title>
  <meta name="description" content="Astra Vigil 2.0: an offline crew health console for deep-space missions. Team MANTA, NASA Space Apps Challenge 2026.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/boot.js"></script>
</head>
<body>
  <canvas id="universe" aria-hidden="true"></canvas>
  <div id="journey" aria-live="polite" hidden><span class="j-dot" aria-hidden="true"></span><span class="j-txt"><b id="j-zone"></b><small id="j-sub"></small></span><span class="j-bar" aria-hidden="true"><i id="j-fill"></i></span></div>
  <a class="skip" href="#main" id="skip">Skip to content</a>

  <header class="nav" id="nav">
    <div class="wrap nav-in">
      <a class="brand" href="#top" aria-label="Astra Vigil 2.0">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M4.5 18h6l3.2-8.5 4.4 15 3.4-9.5h6" fill="none" stroke="var(--lamp)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-t"><b>Astra Vigil</b> <i>2.0</i></span>
      </a>
      <nav class="links" id="links" aria-label="Sections"></nav>
      <div class="tools">
        <button class="tool" id="lang-btn" type="button"></button>
        <button class="tool icon" id="theme-btn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="theme-ico" d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/></svg>
        </button>
        <button class="tool icon menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="links">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div id="progress" aria-hidden="true"></div>
  </header>

  <main id="main">
    <section class="hero stage" id="top">
      <div class="wrap hero-in">
        <ul class="chips" id="hero-chips"></ul>
        <h1 id="hero-title"></h1>
        <div class="hero-row">
          <p class="tagline" id="hero-tagline"></p>
          <div class="hero-side">
            <p class="lede" id="hero-sub"></p>
            <div class="cta">
              <a class="btn primary" id="cta1" href="#playground"></a>
              <a class="btn ghost" id="cta2" href="#architecture"></a>
            </div>
          </div>
        </div>
      </div>
      <figure class="trace wrap" id="trace-fig">
        <canvas id="hero-canvas" role="img"></canvas>
        <figcaption class="trace-cap">
          <span id="trace-caption"></span>
          <span class="trace-ctl">
            <button class="mini" id="trace-replay" type="button"></button>
            <button class="mini" id="trace-pause" type="button" aria-pressed="false"></button>
          </span>
        </figcaption>
      </figure>
    </section>

    <section id="challenge"></section>
    <section id="problems"></section>
    <section id="explore"></section>
    <section id="orbit"></section>
    <section id="updates"></section>
    <section id="detector"></section>
    <section id="playground"></section>
    <section id="architecture"></section>
    <section id="privacy"></section>
    <section id="link"></section>
    <section id="hub"></section>
    <section id="video"></section>
    <section id="nasa"></section>
    <section id="console"></section>
    <section id="hardware"></section>
    <section id="build"></section>
    <section id="limits"></section>
    <section id="team"></section>
  </main>

  <footer class="foot"><div class="wrap">
    <p id="foot-line"></p>
    <a href="#top" id="to-top"></a>
  </div></footer>

  <div class="load-err" id="load-err" hidden role="alert"><p id="load-err-msg"></p><button class="btn ghost" id="load-retry" type="button"></button></div>
  <noscript><p class="wrap ns">Astra Vigil 2.0 needs JavaScript to show this page.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
